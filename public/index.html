<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petrol Pump Manager</title>
<meta name="description" content="Comprehensive petrol pump management application for fuel registers, shifts, meter readings, credit sales, inventory, and payroll.">
<meta property="og:title" content="Petrol Pump Manager">
<meta property="og:description" content="Comprehensive petrol pump management application for fuel registers, shifts, meter readings, credit sales, inventory, and payroll.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16262b">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#16262b;--mute:#5d6e72;--line:#d5dcda;--due:#b8321f;--ok:#0b7a5f;--warn:#b86e00;--btn:#16262b;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1d;--card:#1a272b;--ink:#e8efed;--mute:#97a8ab;--line:#2c3c41;--due:#ff7b66;--ok:#4fd1a5;--warn:#f0b050;--btn:#e8efed;--btnt:#111a1d}}
:root[data-theme="dark"]{--bg:#111a1d;--card:#1a272b;--ink:#e8efed;--mute:#97a8ab;--line:#2c3c41;--due:#ff7b66;--ok:#4fd1a5;--warn:#f0b050;--btn:#e8efed;--btnt:#111a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0}
.total{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--due);margin:2px 0 14px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--btn);color:var(--btnt);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.cust{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-top:10px;cursor:pointer}
.cust b{font-size:17px}.amt{font-weight:800;font-size:18px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sub{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}
.sale{color:var(--due)}.pay{color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#sheet h2{margin:0 0 4px;font-size:19px}
.err{color:var(--due);font-size:13px;margin-top:8px;min-height:18px}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
@media print{.noprint,button{display:none!important}body{background:#fff;color:#000}}
#bdg{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:var(--due);color:#fff;padding:8px 12px;font-size:14px;z-index:9;text-align:center}
/* ===== Responsive theme: phone, tablet and desktop ===== */
:root{--accent:#3b5bdb;--accent-soft:#e8edff;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#6d8cff;--accent-soft:#1d2a57;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--accent:#6d8cff;--accent-soft:#1d2a57;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}
.wrap{max-width:100%;padding:12px 12px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.total{font-size:clamp(34px,9vw,46px);letter-spacing:-.02em}
.amt{font-variant-numeric:tabular-nums;font-weight:700}
input,select,textarea{min-height:44px;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
input[type=checkbox],input[type=radio]{min-height:0;width:auto;margin:0 6px 0 0;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
button{background:var(--accent);color:var(--on-accent,#fff);min-height:44px;border-radius:12px;font-weight:600;letter-spacing:.01em;box-shadow:0 1px 2px rgba(59,91,219,.22);transition:filter .15s,transform .06s,box-shadow .15s}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.98)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.ghost:hover{background:var(--accent-soft);border-color:transparent;filter:none}
button[disabled]{opacity:.5;cursor:not-allowed}
.cust{background:var(--card);border:1px solid transparent;box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;transition:transform .12s,box-shadow .15s}
.cust[tabindex]:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(16,24,40,.08),0 12px 28px rgba(16,24,40,.09);cursor:pointer}
.tbl{background:var(--card);border:1px solid transparent;box-shadow:var(--shadow);border-radius:var(--radius)}
table{font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700}
.sub{color:var(--mute)}
.empty{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
#bdg{border-radius:0 0 12px 12px}
:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:2px}

/* navigation: a scrolling strip on phones, the sidebar on desktop */
.tabs{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:6px;margin:0 -12px 14px;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;color:var(--mute);box-shadow:none;min-height:40px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.tab:hover{background:var(--accent-soft);color:var(--ink);filter:none}
.tab.on{background:var(--accent);color:var(--on-accent,#fff);box-shadow:inset 0 -3px 0 var(--accent-2,transparent),0 1px 2px rgba(59,91,219,.25)}
.wtabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;position:static;background:transparent;border:0;margin:0 0 12px;padding:0}
.wtabs .tab{background:var(--card);color:var(--ink);box-shadow:var(--shadow);text-align:center;white-space:normal;min-height:48px}
.wtabs .tab.on{background:var(--accent);color:var(--on-accent,#fff)}

/* tablet and up */
@media(min-width:720px){
 .wrap{max-width:980px;margin:0 auto;padding:20px 24px 48px}
 .wtabs{grid-template-columns:repeat(4,minmax(0,1fr))}
 #modal{align-items:center}
 #sheet{border-radius:var(--radius);max-height:88vh;margin:16px;padding:22px}
 #app:not(.staff):not(.auth){max-width:720px;margin:0 auto}
 #app.auth{max-width:440px;margin:56px auto}
 #app.staff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
 #app.staff>*{grid-column:1/-1}
 #app.staff>.cust{grid-column:auto}
 #app.staff>.tabs{margin:0 0 4px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:6px}
}

/* desktop */
@media(min-width:1100px){
 .wrap{max-width:1400px;padding:24px 32px 56px}
 #app.staff{grid-template-columns:248px repeat(3,minmax(0,1fr));gap:18px}
 #app.staff>.tabs{grid-column:1;grid-row:1/span 200;position:sticky;top:20px;flex-direction:column;overflow-x:visible;overflow-y:auto;max-height:calc(100vh - 40px);align-self:start;margin:0;padding:12px;background:var(--card)}
 #app.staff>.tabs .tab{width:100%;text-align:left;justify-content:flex-start;padding:10px 14px;font-size:14px}
 #app.staff>*:not(.tabs){grid-column:2/-1}
 #app.staff>.cust{grid-column:auto}
 #app.staff .tbl{overflow-x:auto}
 #app:not(.staff):not(.auth){max-width:760px}
 .wtabs{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* dashboards */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 14px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.kv{font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:4px 0 2px;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:12px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bc i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:8px 8px 4px 4px;min-height:2px}
.bv{font-size:11px;color:var(--mute);margin-bottom:4px;white-space:nowrap}
.bl{font-size:11px;color:var(--mute);margin-top:4px}
.wtabs .tab:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.wtabs{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:1100px){.wtabs{grid-template-columns:repeat(5,minmax(0,1fr))}.wtabs .tab:last-child:nth-child(odd){grid-column:auto}}

/* small screens: buttons wrap, and wide tables scroll inside their own box */
.btns,.row{flex-wrap:wrap}
@media(max-width:1099px){#app table{display:block;overflow-x:auto;max-width:100%;white-space:nowrap}#app .tbl table{display:table}}
</style>
</head>
<body>
<div id="bdg"></div>
<div class="wrap" id="app"></div>
<div id="modal"><div id="sheet"></div></div>
<script src="/app.js"></script>
</body>
</html>
